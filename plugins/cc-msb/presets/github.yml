# Preset: github — wire host credentials into the sandbox so `gh`, `git`,
# and direct REST calls just work. Picks up `gh auth token` and the host's
# `git config --global` user.name/user.email at sandbox-create time.
#
# Activate via `.cc-msb.yml`:
#   presets: [github]
#
# The network list opens the standard GitHub hosts (git clone, API, release
# downloads, raw content, GitHub Packages npm registry). When a token is
# autodetected, config.mjs also enables TLS-intercept and injects GH_TOKEN
# into the sandbox as a secret for those same hosts.

defaults:
  network: "github.com,api.github.com,codeload.github.com,objects.githubusercontent.com,raw.githubusercontent.com,npm.pkg.github.com"
  git_user_autodetect: true
  git_token_autodetect: true
