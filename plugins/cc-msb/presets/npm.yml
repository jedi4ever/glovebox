# Preset: npm — pin the network allowlist to the hosts npm/yarn/pnpm need
# at install time, including registries and the node.org binary CDN used
# by node-pre-gyp and similar postinstall downloaders.
#
# Activate via `.cc-msb.yml`:
#   presets: [npm]

defaults:
  network: "registry.npmjs.org,registry.yarnpkg.com,nodejs.org"
