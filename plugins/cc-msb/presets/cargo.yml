# Preset: cargo — pin the network allowlist to the hosts Cargo needs for
# `cargo build`, `cargo add`, `cargo install`, and registry index fetches.
#
# Network hosts opened:
#   crates.io          — registry index API
#   static.crates.io   — crate tarball CDN
#   index.crates.io    — sparse registry index (cargo ≥ 1.68 default)
#
# For crates with build scripts that download toolchains (e.g. ring, aws-lc-rs),
# compose with the relevant platform preset.
#
# Activate via `.cc-msb.yml`:
#   presets: [cargo]

defaults:
  network: "crates.io,static.crates.io,index.crates.io"
