# Preset: dev — opinionated baseline for daily development against the
# bundled glovebox image (gh, git, ripgrep, node, go, uv pre-installed).
#
# Activate via `.glovebox.yml`:
#   presets: [dev]
#
# Automatically composes the npm and github presets so npm installs,
# git operations and gh CLI calls all work without extra configuration.
# These are *defaults*: anything the user sets in `main:` or `defaults:`
# of their own `.glovebox.yml` always wins.

presets:
  - npm
  - github
  - apt
  - docker
  - pip
  - go
  - cargo

defaults:
  sandbox_image: localhost:5123/glovebox
  mount_workdir: true
  scope: directory
  auto_recreate: true
