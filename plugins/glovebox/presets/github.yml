# Preset: github — wire host credentials into the sandbox so `gh`, `git`,
# and direct REST calls just work. Picks up `gh auth token` and the host's
# `git config --global` user.name/user.email at sandbox-create time.
#
# Activate via `.glovebox.yml`:
#   presets: [github]
#
# Network hosts opened:
#   github.com, api.github.com        — git clone, REST/GraphQL API
#   codeload.github.com               — archive/tarball downloads
#   objects.githubusercontent.com     — Git LFS + binary object storage
#   raw.githubusercontent.com         — raw file access
#   uploads.github.com                — release asset uploads (gh release upload)
#   npm.pkg.github.com                — GitHub Packages npm registry
#   ghcr.io                           — GitHub Container Registry (pull/push)
#   pkg-containers.githubusercontent.com — GHCR layer blob storage
#
# When a token is autodetected, TLS-intercept is enabled and GH_TOKEN is
# injected as a secret for those same hosts.

defaults:
  network: "github.com,api.github.com,codeload.github.com,objects.githubusercontent.com,raw.githubusercontent.com,uploads.github.com,npm.pkg.github.com,ghcr.io,pkg-containers.githubusercontent.com"
  git_user_autodetect: true
  git_token_autodetect: true
