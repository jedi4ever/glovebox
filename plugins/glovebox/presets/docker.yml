# Preset: docker — pin the network allowlist to the hosts needed for
# Docker Hub image pulls via docker, podman, skopeo, or build tooling.
#
# Network hosts opened:
#   registry-1.docker.io              — Docker Hub v2 registry API + layer downloads
#   auth.docker.io                    — Docker Hub token authentication service
#   production.cloudflare.docker.com  — Docker Hub layer CDN (Cloudflare)
#   index.docker.io                   — Legacy v1 index (still used by some clients)
#
# For images hosted on GHCR (ghcr.io), compose with [github]:
#   presets: [docker, github]
#
# Activate via `.glovebox.yml`:
#   presets: [docker]

defaults:
  network: "registry-1.docker.io,auth.docker.io,production.cloudflare.docker.com,index.docker.io"
